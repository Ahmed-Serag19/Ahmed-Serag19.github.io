# Builds the Upwork-safe variant of the portfolio (no contact details)
# from Ahmed-Serag19/Updated--portfolio and publishes it to GitHub Pages.
name: Deploy Upwork portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # daily, picks up portfolio changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ahmed-Serag19/Updated--portfolio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:upwork
      - name: Fail if contact details leaked into the build
        run: |
          if grep -rEq 'hotmail|wa\.me|linkedin\.com|201001386765' dist; then
            echo "Contact details found in Upwork build"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
